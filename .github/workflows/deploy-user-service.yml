name: Deploy User Service
on:
  push:
    branches: ["develop"]
    paths:
      - "backend/services/user-service/**"
      - ".github/workflows/deploy-user-service.yml"
      - ".github/workflows/deploy-template.yml"

jobs:
  deploy:
    uses: ./.github/workflows/deploy-template.yml
    with:
      service_name: "user-service"
    secrets: inherit
