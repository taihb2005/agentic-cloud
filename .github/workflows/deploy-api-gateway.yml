name: Deploy Api gateway
on:
  push:
    branches: ["develop"]
    paths:
      - "backend/api-gateway/**"
      - ".github/workflows/deploy-api-gateway.yml"
      - ".github/workflows/deploy-template.yml"

jobs:
  deploy:
    uses: ./.github/workflows/deploy-template.yml
    with:
      service_name: "api-gateway"
    secrets: inherit
