name: Deploy Agent Service
on:
  push:
    branches: ["develop"]
    paths:
      - "backend/services/agent-service/**"
      - ".github/workflows/deploy-agent-service.yml"
      - ".github/workflows/deploy-template.yml"

jobs:
  deploy:
    uses: ./.github/workflows/deploy-template.yml
    with:
      service_name: "agent-service"
    secrets: inherit
