syntax = "proto3";

package storage.v1;

option java_package = "vn.edu.hust.kat.proto.gateway.v1";
option java_outer_classname = "FindUserProto";
option java_multiple_files = true;

service ApiGateway {
  rpc FindUser(FindUserRequest) returns (FindUserResponse);
}

message FindUserRequest {
  string user_id = 1;
}

message FindUserResponse {
  string user_id = 1;
  bool exists = 2;
}