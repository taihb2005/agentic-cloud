services:
  api-gateway:
    build:
      context: ../
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JWT_SECRET: ${JWT_SECRET}
    #      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
    networks:
      - microservice-net
