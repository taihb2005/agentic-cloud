server:
  port: 8089

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Route: User Service
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/user-service/**

            # Route 2: Storage Service
            - id: storage-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/storage-service/**

            # Route 3: Agent Service
            - id: agent-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/agent-service/**

jwt:
  secret: ${JWT_SECRET}