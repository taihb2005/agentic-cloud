#              uri: http://localhost:8084
#              predicates:
#                - Path=/api/v1/agent-service/**

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    vn.edu.hust.kat.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG