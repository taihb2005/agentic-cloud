server:
  port: 8089

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Route: User Service
            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/v1/user-service/**
              filters:
                - StripPrefix=2

#            # Route 2: Storage Service
#            - id: storage-service
#              uri: http://localhost:8082
#              predicates:
#                - Path=/api/v1/storage-service/**
#
#            # Route 3: Agent Service
