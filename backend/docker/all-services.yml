services:
  api-gateway:
    build:
      context: ../
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=test
#      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
    depends_on:
      - user-service
    networks:
      - microservice-net

  # Service 1: User Service
  user-service:
    build:
      context: ..
      dockerfile: ./services/user-service/docker-compose.yml
    container_name: user-service
    environment:
      - SERVER_PORT=8081
    expose:
      - "8081"
    networks:
      - microservice-net

networks:
  microservice-net:
    driver: bridge