services:
  app:
    build:
      context: ../..
      dockerfile: services/storage-service/Dockerfile
    container_name: storage-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      STORAGE_SPRING_PROFILES_ACTIVE: ${STORAGE_SPRING_PROFILES_ACTIVE}
      STORAGE_DB_HOST: ${STORAGE_DB_HOST}
      STORAGE_DB_PORT: ${STORAGE_DB_PORT}
      STORAGE_DB_NAME: ${STORAGE_DB_NAME}
      STORAGE_DB_USERNAME: ${STORAGE_DB_USERNAME}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      STORAGE_KAFKA_BOOTSTRAP_SERVER: ${STORAGE_KAFKA_BOOTSTRAP_SERVER}
      STORAGE_MINIO_ENABLED: ${STORAGE_MINIO_ENABLED}
      STORAGE_MINIO_ENDPOINT: ${STORAGE_MINIO_ENDPOINT}
      STORAGE_MINIO_DEFAULT_BUCKET: ${STORAGE_MINIO_DEFAULT_BUCKET}
      STORAGE_MINIO_ROOT_USER: ${STORAGE_MINIO_ROOT_USER}
      STORAGE_MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_ROOT_PASSWORD}
      STORAGE_DEFAULT_QUOTA_BYTES: ${STORAGE_DEFAULT_QUOTA_BYTES}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservice-net

  postgres:
    image: postgres:17
    container_name: storage-service-db
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STORAGE_DB_NAME}
      POSTGRES_USER: ${STORAGE_DB_USERNAME}
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD}
    volumes:
      - storage_service_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-net

  minio:
    image: taihb2005/minio:1.0.0
    container_name: minio-storage
    hostname: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_MINIO_ROOT_PASSWORD}
    volumes:
      - ${STORAGE_MINIO_HOST_VOLUME}:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-net

volumes:
  storage_service_postgres_data:

networks:
  microservice-net:
    name: microservice-net
    external: true
