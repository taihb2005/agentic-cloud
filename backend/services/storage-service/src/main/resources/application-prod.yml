spring:
  datasource:
    url: jdbc:postgresql://${STORAGE_DB_HOST}:${STORAGE_DB_PORT}/${STORAGE_DB_NAME}
    username: ${STORAGE_DB_USERNAME}
    password: ${STORAGE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  grpc:
    server:
      enabled: true
      port: 9092
      keep-alive:
        time: 1h
        timeout: 20s
      reflection:
        enabled: true
      address: 0.0.0.0

  jackson:
    property-naming-strategy: SNAKE_CASE

  kafka:
    bootstrap-servers: ${STORAGE_KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[spring.json.add.type.headers]": true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:postgresql://${STORAGE_DB_HOST}:${STORAGE_DB_PORT}/${STORAGE_DB_NAME}
    user: ${STORAGE_DB_USERNAME}
    password: ${STORAGE_DB_PASSWORD}

app:
  minio:
    enabled: ${STORAGE_MINIO_ENABLED:true}
    endpoint: ${STORAGE_MINIO_ENDPOINT:http://minio:9000}
    access-key: ${STORAGE_MINIO_ROOT_USER}
    secret-key: ${STORAGE_MINIO_ROOT_PASSWORD}
    default-bucket: ${STORAGE_MINIO_DEFAULT_BUCKET:smart-cloud-storage}
    default-quota-bytes: ${STORAGE_DEFAULT_QUOTA_BYTES:16106127360} # 15 GB
    user-prefix-pattern: "users/%s/"
    public-endpoint: ${STORAGE_PUBLIC_MINIO_ENDPOINT:http://localhost:9000}
    presigned-url-expiry-seconds: ${PRESIGNED_EXPIRY}
  node_async_threshold: 50
  kafka:
    topics:
      user-service:
        user-created: "user.events.user-created"
      storage-service:
        node-permanent-delete: "storage.node.node-permanent-delete"
        minio-events: ${STORAGE_NOTIFY_KAFKA_TOPIC}


logging:
  level:
    root: WARN
    vn.edu.hust.kat.storageservice: INFO
  file:
    name: /var/log/storage-service/app.log

springdoc:
  swagger-ui:
    enabled: false   # disable swagger in prod (optional)
