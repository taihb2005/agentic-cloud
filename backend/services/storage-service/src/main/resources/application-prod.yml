spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  grpc:
    server:
      enabled: true
      port: 9092
      max-inbound-message-size: 10MB # Payload maximum size
      keep-alive:
        time: 1h
        timeout: 20s
        permit-without-calls: true
        permit-time: 5m
      reflection:
        enabled: true
      exception-handling:
        enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[spring.json.add.type.headers]": true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    default-bucket: ${MINIO_DEFAULT_BUCKET:smart-cloud-storage}
    default-quota-bytes: ${STORAGE_DEFAULT_QUOTA_BYTES:16106127360} # 15 GB
    user-prefix-pattern: "users/%s/"

logging:
  level:
    root: WARN
    vn.edu.hust.kat.storageservice: INFO
  file:
    name: /var/log/storage-service/app.log

springdoc:
  swagger-ui:
    enabled: false   # disable swagger in prod (optional)
