spring:
  profiles:
    active: ${STORAGE_SPRING_PROFILES_ACTIVE:${SPRING_PROFILES_ACTIVE:dev}}
  application:
    name: storage-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8082

app:
  minio:
    enabled: ${STORAGE_MINIO_ENABLED:${MINIO_ENABLED:true}}
    endpoint: ${STORAGE_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${STORAGE_MINIO_ROOT_USER:${MINIO_ROOT_USER:taihb2005}}
    secret-key: ${STORAGE_MINIO_ROOT_PASSWORD:${MINIO_ROOT_PASSWORD:admin@123}}
    default-bucket: ${STORAGE_MINIO_DEFAULT_BUCKET:${MINIO_DEFAULT_BUCKET:smart-cloud-storage}}
    default-quota-bytes: ${STORAGE_DEFAULT_QUOTA_BYTES:16106127360} # 15 GB
    user-prefix-pattern: "users/%s/"
    presigned-url-expiry-seconds: ${STORAGE_MINIO_PRESIGNED_EXPIRY:900}
  kafka:
    topics:
      user-service:
        user-created: "${USER_CREATED_TOPIC:user.events.user-created}"
      storage-service:
        node-permanent-delete: "${NODE_PERMANENT_DELETE_TOPIC:storage.node.node-permanent-delete}"
        minio-events: "${STORAGE_MINIO_EVENTS_TOPIC:minio.events.object-created}"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    vn.edu.hust.kat.storageservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"
