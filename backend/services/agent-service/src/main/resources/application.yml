spring:
  application:
    name: agent-service
  profiles:
    active: ${AGENT_SPRING_PROFILES_ACTIVE:${SPRING_PROFILES_ACTIVE:dev}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  grpc:
    server:
      enabled: ${AGENT_GRPC_SERVER_ENABLED:false}
    client:
      channel:
        storage:
          target: "${STORAGE_GRPC_TARGET:localhost:9093}"

server:
  port: 8083

app:
  llm:
    openai:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: ${OPENAI_MODEL_NAME:gpt-4o-mini}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

  agent:
    prompts:
      tools-location: ${AGENT_TOOL_PROMPTS_LOCATION:classpath:prompts/tool-prompts.yml}
    memory:
      max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
      session-ttl-minutes: ${AGENT_MEMORY_SESSION_TTL_MINUTES:45}
      min-score: ${AGENT_MEMORY_MIN_SCORE:0.68}
      rag-max-results: ${AGENT_MEMORY_RAG_MAX_RESULTS:5}
    pgvector:
      enabled: ${PGVECTOR_ENABLED:false}
      table: ${PGVECTOR_TABLE:agent_long_term_memory}
      dimension: ${PGVECTOR_DIMENSION:1536}
      use-index: ${PGVECTOR_USE_INDEX:false}
      index-list-size: ${PGVECTOR_INDEX_LIST_SIZE:100}
      create-table: ${PGVECTOR_CREATE_TABLE:true}
      drop-table-first: ${PGVECTOR_DROP_TABLE_FIRST:false}

  minio:
    endpoint: ${STORAGE_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${STORAGE_MINIO_ROOT_USER:${MINIO_ROOT_USER:taihb2005}}
    secret-key: ${STORAGE_MINIO_ROOT_PASSWORD:${MINIO_ROOT_PASSWORD:admin@123}}
    default-bucket: ${STORAGE_MINIO_DEFAULT_BUCKET:${MINIO_DEFAULT_BUCKET:smart-cloud-storage}}

  kafka:
    topics:
      minio-events: "${STORAGE_MINIO_EVENTS_TOPIC:minio.events.object-created}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    vn.edu.hust.kat.agentservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
