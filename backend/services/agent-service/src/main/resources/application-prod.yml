spring:
  datasource:
    url: jdbc:postgresql://${AGENT_DB_HOST}:${AGENT_DB_PORT}/${AGENT_DB_NAME}
    username: ${AGENT_DB_USERNAME}
    password: ${AGENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  grpc:
    server:
      enabled: ${AGENT_GRPC_SERVER_ENABLED:false}
    client:
      channel:
        storage:
          target: "${STORAGE_GRPC_TARGET:storage-service:9092}"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${AGENT_KAFKA_BOOTSTRAP_SERVER:kafka:9094}}
    consumer:
      group-id: agent-ingestion-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  llm:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      model-name: ${OPENAI_MODEL_NAME}
      embedding-model: ${OPENAI_EMBEDDING_MODEL}

  agent:
    prompts:
      tools-location: ${AGENT_TOOL_PROMPTS_LOCATION:classpath:prompts/tool-prompts.yml}
    memory:
      max-messages: ${AGENT_MEMORY_MAX_MESSAGES:20}
      session-ttl-minutes: ${AGENT_MEMORY_SESSION_TTL_MINUTES:45}
      min-score: ${AGENT_MEMORY_MIN_SCORE:0.68}
      rag-max-results: ${AGENT_MEMORY_RAG_MAX_RESULTS:5}
    pgvector:
      enabled: ${PGVECTOR_ENABLED:true}
      table: ${PGVECTOR_TABLE:agent_long_term_memory}
      dimension: ${PGVECTOR_DIMENSION:1536}
      use-index: ${PGVECTOR_USE_INDEX:false}
      index-list-size: ${PGVECTOR_INDEX_LIST_SIZE:100}
      create-table: ${PGVECTOR_CREATE_TABLE:true}
      drop-table-first: ${PGVECTOR_DROP_TABLE_FIRST:false}

  minio:
    endpoint: ${STORAGE_MINIO_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${STORAGE_MINIO_ROOT_USER:${MINIO_ROOT_USER:taihb2005}}
    secret-key: ${STORAGE_MINIO_ROOT_PASSWORD:${MINIO_ROOT_PASSWORD:admin@123}}
    default-bucket: ${STORAGE_MINIO_DEFAULT_BUCKET:${MINIO_DEFAULT_BUCKET:smart-cloud-storage}}

  kafka:
    topics:
      minio-events: "${STORAGE_MINIO_EVENTS_TOPIC:minio.events.object-created}"


springdoc:
  swagger-ui:
    enabled: false
