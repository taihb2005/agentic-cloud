spring:
  datasource:
    url: jdbc:postgresql://${AGENT_DB_HOST}:${AGENT_DB_PORT}/${AGENT_DB_NAME}
    username: ${AGENT_DB_USERNAME}
    password: ${AGENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  grpc:
    client:
      channel:
        storage:
          target: "storage-service:9092"

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: agent-ingestion-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  llm:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      model-name: ${OPENAI_MODEL_NAME}
      embedding-model: ${OPENAI_EMBEDDING_MODEL}

  agent:
    prompts:
      tools-location: ${AGENT_TOOL_PROMPTS_LOCATION}
    memory:
      max-messages: ${AGENT_MEMORY_MAX_MESSAGES}
      session-ttl-minutes: ${AGENT_MEMORY_SESSION_TTL_MINUTES}
      min-score: ${AGENT_MEMORY_MIN_SCORE}
      rag-max-results: ${AGENT_MEMORY_RAG_MAX_RESULTS}
    pgvector:
      enabled: ${PGVECTOR_ENABLED}
      table: ${PGVECTOR_TABLE}
      dimension: ${PGVECTOR_DIMENSION}
      use-index: ${PGVECTOR_USE_INDEX}
      index-list-size: ${PGVECTOR_INDEX_LIST_SIZE}
      create-table: ${PGVECTOR_CREATE_TABLE}
      drop-table-first: ${PGVECTOR_DROP_TABLE_FIRST}

  minio:
    endpoint: ${STORAGE_MINIO_ENDPOINT}
    access-key: ${STORAGE_MINIO_ROOT_USER}
    secret-key: ${STORAGE_MINIO_ROOT_PASSWORD}
    default-bucket: ${STORAGE_MINIO_DEFAULT_BUCKET}

  kafka:
    topics:
      minio-events: "${STORAGE_MINIO_EVENTS_TOPIC:minio.events.object-created}"


springdoc:
  swagger-ui:
    enabled: false
