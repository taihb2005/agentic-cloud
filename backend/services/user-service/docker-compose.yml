services:
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      USER_SPRING_PROFILES_ACTIVE: ${USER_SPRING_PROFILES_ACTIVE}
      USER_DB_HOST: ${USER_DB_HOST}
      USER_DB_PORT: ${USER_DB_PORT}
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      USER_ADMIN_USERNAME: ${USER_ADMIN_USERNAME}
      USER_ADMIN_EMAIL: ${USER_ADMIN_EMAIL}
      USER_ADMIN_PASSWORD: ${USER_ADMIN_PASSWORD}
      USER_JWT_SECRET: ${USER_JWT_SECRET}
      USER_JWT_ACCESS_EXPIRY: ${USER_JWT_ACCESS_EXPIRY}
      USER_JWT_REFRESH_EXPIRY: ${USER_JWT_REFRESH_EXPIRY}
      USER_CORS_ALLOWED_ORIGINS: ${USER_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      USER_KAFKA_BOOTSTRAP_SERVER: ${USER_KAFKA_BOOTSTRAP_SERVER}
    depends_on:
      postgres-user-service:
        condition: service_healthy
    networks:
      - microservice-net
      - user-db-net

  postgres-user-service:
    image: postgres:17
    container_name: user-service-db
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user_service_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-db-net

volumes:
  user_service_postgres_data:
