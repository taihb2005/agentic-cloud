spring:
  datasource:
    url: jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT}/${USER_DB_NAME}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jackson:
    property-naming-strategy: SNAKE_CASE

  grpc:
    client:
      channel:
        storage:
          target: "storage-service:9092"
  kafka:
    bootstrap-servers: ${USER_KAFKA_BOOTSTRAP_SERVER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[delivery.timeout.ms]": 120000
        "[request.timeout.ms]": 30000
        "[spring.json.add.type.headers]": true

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:postgresql://${USER_DB_HOST}:${USER_DB_PORT}/${USER_DB_NAME}
    user: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}

app:
  admin:
    username: ${USER_ADMIN_USERNAME}
    email: ${USER_ADMIN_EMAIL}
    password: ${USER_ADMIN_PASSWORD}

logging:
  level:
    root: WARN
    vn.edu.hust.kat.userservice: INFO
  file:
    name: /var/log/user-service/app.log

springdoc:
  swagger-ui:
    enabled: false
