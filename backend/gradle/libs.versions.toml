# =============================================================================
# Gradle Version Catalog – Agentic Cloud Platform
# Spring Boot 4.1.1 compatible
# =============================================================================

[versions]
# ── Platform / Language ──────────────────────────────────────────────────────
java = "21"

# ── Spring Ecosystem ────────────────────────────────────────────────────────
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.1.2"

# ── gRPC / Protobuf ─────────────────────────────────────────────────────────
grpc = "1.85.1"
protobuf = "4.35.1"
protobuf-plugin = "0.10.0"

# ── Third-party ─────────────────────────────────────────────────────────────
lombok = "1.18.42"
jjwt = "0.13.0"
bucket4j = "8.10.1"
springdoc = "3.1.1"
jackson-annotations = "2.22"
minio = "9.0.3"
hypersistence-utils = "3.16.0"
junit-bom = "5.10.0"
jakarta-annotation = "3.0.0"


# =============================================================================
[libraries]
# ── Spring Boot Starters (managed by BOM – no version needed at use site) ───
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway"}
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux"}
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

# ── Spring gRPC (native in Spring Boot 4.1) ─────────────────────────────────
spring-boot-starter-grpc-server = { module = "org.springframework.boot:spring-boot-starter-grpc-server" }
spring-boot-starter-grpc-client = { module = "org.springframework.boot:spring-boot-starter-grpc-client" }

# ── Spring Framework (managed by BOM) ───────────────────────────────────────
spring-web = { module = "org.springframework:spring-web" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# ── Spring Cloud ─────────────────────────────────────────────────────────────
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }

# ── gRPC / Protobuf ─────────────────────────────────────────────────────────
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-bom = { module = "com.google.protobuf:protobuf-bom", version.ref = "protobuf" }

# ── Jakarta ──────────────────────────────────────────────────────────────────
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }

# ── Lombok ───────────────────────────────────────────────────────────────────
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# ── JWT ──────────────────────────────────────────────────────────────────────
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# ── Rate Limiting ────────────────────────────────────────────────────────────
bucket4j-core = { module = "com.bucket4j:bucket4j-core", version.ref = "bucket4j" }

# ── OpenAPI / Swagger ────────────────────────────────────────────────────────
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

# ── Jackson ──────────────────────────────────────────────────────────────────
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }

# ── Database ─────────────────────────────────────────────────────────────────
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }

# ── Database Extensions ─────────────────────────────────────────────────────
hypersistence-utils = { module = "io.hypersistence:hypersistence-utils-hibernate-73", version.ref = "hypersistence-utils" }

# ── Flyway ───────────────────────────────────────────────────────────────────
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# ── Object Storage ──────────────────────────────────────────────────────────
minio = { module = "io.minio:minio", version.ref = "minio" }

# ── Testing ──────────────────────────────────────────────────────────────────
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }


# =============================================================================
[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
